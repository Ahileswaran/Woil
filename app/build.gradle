plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def MAPS_API_KEY = project.hasProperty("MAPS_API_KEY") ? project.property("MAPS_API_KEY") : ""
android {
    defaultConfig {
        manifestPlaceholders = [ MAPS_API_KEY: MAPS_API_KEY ]
    }
}

android {
    namespace 'com.example.woil'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.woil"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // manifest placeholder: used in AndroidManifest.xml as ${MAPS_API_KEY}
        manifestPlaceholders = [ MAPS_API_KEY: MAPS_API_KEY ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // If you use Kotlin, add kotlinOptions here
}

dependencies {
    // Firebase BOM - manage Firebase versions from a single place
    implementation platform('com.google.firebase:firebase-bom:34.8.0')

    // Firebase libs (no versions when using BOM)
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-appcheck-debug' // debug App Check if required

    // Google Play services / Maps / Places
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.libraries.places:places:2.7.0' // optional for Places/Autocomplete

    // Material + UI libs
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.navigation:navigation-fragment:2.7.7"
    implementation "androidx.navigation:navigation-ui:2.7.7"

    // Image + animation libs
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'com.airbnb.android:lottie:6.1.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
}